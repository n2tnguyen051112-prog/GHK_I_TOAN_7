","img":"line"}],"fill":[{"id":"F17a","source":"Điền 17A","kind":"fill","n":17,"topic":"Tam giác bằng nhau","q":"Cho ΔABC = ΔDEF và AB = 5 cm. Tính độ dài DE (cm).","answers":["5","5cm"],"pretty":"5 cm","why":"Theo thứ tự đỉnh A ↔ D, B ↔ E, C ↔ F nên AB = DE."},{"id":"F17b","source":"Điền 17B","kind":"fill","n":17,"topic":"Tam giác bằng nhau","q":"Cho ΔABC = ΔDEF, ∠EDF = 50°. Tính ∠BAC (độ).","answers":["50","50°"],"pretty":"50°","why":"∠BAC ứng với ∠EDF trong hai tam giác bằng nhau."},{"id":"F18a","source":"Điền 18A","kind":"fill","n":18,"topic":"Tam giác bằng nhau","q":"Cho ΔMNP = ΔHIK và IK = 4 cm. Tính độ dài NP (cm).","answers":["4","4cm"],"pretty":"4 cm","why":"Theo thứ tự đỉnh N ↔ I, P ↔ K nên NP = IK."},{"id":"F18b","source":"Điền 18B","kind":"fill","n":18,"topic":"Tam giác bằng nhau","q":"Cho ΔMNP = ΔHIK và ∠M = 40°. Tính ∠H (độ).","answers":["40","40°"],"pretty":"40°","why":"∠M và ∠H là hai góc tương ứng."}],"essays":[{"id":"E1","source":"Tự luận 1","n":1,"kind":"essay","title":"So sánh các số hữu tỉ","q":"So sánh: a) 0 và 14/15; b) 0 và −9/13; c) −1 2/5 và 7,12; d) −3/14 và −5/14.","solution":"a) 0 < 14/15. b) 0 > −9/13. c) −1 2/5 < 7,12. d) −3/14 > −5/14 vì −3 > −5 khi mẫu dương bằng nhau.","topic":"Số hữu tỉ","img":null},{"id":"E2","source":"Tự luận 2","n":2,"kind":"essay","title":"Tính bốn phép toán","q":"a) −1/3 + 0,5; b) 3/2 − 0,3; c) (7/2) × 0,5; d) 0,4 : (2/3).","solution":"a) 1/6. b) 6/5 (1,2). c) 7/4 (1,75). d) 3/5 (0,6). Khi cần đổi các số thập phân về phân số để tính chính xác.","topic":"Phép toán","img":null},{"id":"E3","source":"Tự luận 3","n":3,"kind":"essay","title":"Quy tắc lũy thừa","q":"a) (4/5)³·(4/5)⁴; b) (0,3)⁴ : (0,3)³; c) [(-0,24)³]⁵ : (-0,24)⁶; d) (4²·4³·3⁴)/(2¹⁰·9).","solution":"a) (4/5)⁷. b) 0,3¹ = 0,3. c) (-0,24)⁹. d) 3² = 9 (vì 4⁵ = 2¹⁰ và 9 = 3²).","topic":"Phép toán","img":null},{"id":"E4","source":"Tự luận 4","n":4,"kind":"essay","title":"Tính hợp lí","q":"a) 1 2/7 + (5/7 − 4/5) − (0,2 + 2 3/4). b) 12 + 8·(−1/2)³ + (2022⁰ : 1/2)². c) 11/24 − 5/41 + 13/24 + 0,5 − 36/41. d) 17 1/3·(−3/7) + 3 2/3·(−3/7) + 0,25. e) 7/5 − 0,27 − 2/5 + 0,5 − 0,73. f) 3,2·16,54 − 1,2·5,6 + 3,2·3,46 − 1,2·14,4.","solution":"a) −7/4. b) 15. c) 0,5. d) −8,75. e) 0,5. f) 40 (nhóm 3,2·(16,54+3,46)−1,2·(5,6+14,4) = 64−24).","topic":"Phép toán","img":null},{"id":"E5","source":"Tự luận 5","n":5,"kind":"essay","title":"Tìm x","q":"a) x + 1/6 = −5/12. b) x − 2 1/3 = −5/12. c) 3/4 + (x − 2/3) = 1 1/3. d) −3/8·x − 0,75 = −1 1/2.","solution":"a) x = −7/12. b) x = 23/12. c) x = 5/4. d) x = 2. Dùng quy tắc chuyển vế, thu gọn trước khi chia cho hệ số của x.","topic":"Phép toán","img":null},{"id":"E6","source":"Tự luận 6","n":6,"kind":"essay","title":"Bài toán giảm giá","q":"Một người mua món 125.000đ giảm 30%, món 300.000đ giảm 15%; món thứ ba giảm 12,5%. Tổng thanh toán 692.500đ. Tính giá gốc món thứ ba.","solution":"Món 1 trả 87.500đ; món 2 trả 255.000đ; món 3 trả 692.500−87.500−255.000=350.000đ. Giá gốc món 3 =350.000/0,875=400.000đ.","topic":"Ứng dụng","img":null},{"id":"E7","source":"Tự luận 7","n":7,"kind":"essay","title":"Bài toán pizza","q":"4 bánh pizza giá 10,25 USD/bánh, mỗi bánh được giảm 1,5 USD. Hỏi phải trả bao nhiêu USD?","solution":"Mỗi bánh trả 10,25−1,5=8,75 USD; cả 4 bánh: 4·8,75=35 USD.","topic":"Ứng dụng","img":null},{"id":"E8","source":"Tự luận 8","n":8,"kind":"essay","title":"Bài toán khinh khí cầu","q":"Khinh khí cầu bay lên đều 0,8 m/s trong 50 giây rồi hạ xuống đều 5/9 m/s trong 27 giây. Tính độ cao sau khi hạ.","solution":"Độ cao sau khi bay lên: 0,8·50=40 m. Giảm 5/9·27=15 m. Còn cao 40−15=25 m.","topic":"Ứng dụng","img":null},{"id":"E9","source":"Tự luận 9","n":9,"kind":"essay","title":"Tia phân giác và số đo góc","q":"Theo hình gốc: a) Tia nào phân giác ∠BAC khi ∠BAC =130°? Tính ∠BAD. b) Tia nào phân giác ∠xOy khi ∠xOt =42°? Tính ∠xOy.","solution":"a) Tia AD phân giác ∠BAC, nên ∠BAD=130°/2=65°. b) Tia Ot phân giác ∠xOy, nên ∠xOy=2·42°=84°.","topic":"Góc và đường thẳng song song","img":"angles9"},{"id":"E10","source":"Tự luận 10","n":10,"kind":"essay","title":"Chứng minh song song","q":"Theo Hình 3, 4, 5 của phiếu: giải thích a//b hoặc m//n dựa trên các góc được đánh dấu.","solution":"Hình 3: hai góc so le trong cùng 50° nên a//b. Hình 4: hai góc đồng vị cùng 120° nên m//n. Hình 5: a và b cùng vuông góc với một đường thẳng nên a//b.","topic":"Góc và đường thẳng song song","img":"parallel10"},{"id":"E11","source":"Tự luận 11","n":11,"kind":"essay","title":"Tính góc khi hai đường song song","q":"Theo hình gốc, a//b, ∠A₄=60°. Hãy tìm ∠A₂, ∠B₂, ∠B₄, ∠A₁ và chỉ ra một số góc so le trong, đồng vị.","solution":"∠A₂=60° (đối đỉnh A₄); ∠B₂=60° (đồng vị với A₂); ∠B₄=60° (đồng vị với A₄); ∠A₁=120° (kề bù A₄). Ví dụ: A₄ và B₂ so le trong.","topic":"Góc và đường thẳng song song","img":"parallel11"},{"id":"E12","source":"Tự luận 12","n":12,"kind":"essay","title":"Góc qua hai đường song song","q":"Cho xy//zt và ∠DCy=120° như hình. Tính ∠xCm, ∠zDC, ∠nDt, ∠CDt và chỉ ra cặp góc so le trong, đồng vị.","solution":"∠xCm=120° (đối đỉnh với ∠DCy); ∠zDC=120° (so le trong với ∠DCy); ∠nDt=120° (đối đỉnh ∠zDC); ∠CDt=60° (kề bù ∠zDC).","topic":"Góc và đường thẳng song song","img":"parallel12"},{"id":"E13","source":"Tự luận 13","n":13,"kind":"essay","title":"Chứng minh và tính góc","q":"Theo hình: a) Chứng minh a//b; b) tính các góc C₁, D₁, D₂.","solution":"Vì a và b đều vuông góc cùng đường thẳng AB nên a//b. ∠C₁=75° (đối đỉnh góc 75°); ∠D₁=75° (đồng vị với góc 75° ở C); ∠D₂=105° (kề bù D₁).","topic":"Góc và đường thẳng song song","img":"parallel13"},{"id":"E14","source":"Tự luận 14","n":14,"kind":"essay","title":"Tổng ba góc tam giác","q":"a) ΔMNP có M=70°, N=60°. b) ΔABC có B=100°, C=50°. c) ΔDEF vuông tại D, E=40°. Tính góc còn lại ở mỗi tam giác.","solution":"a) P=180−70−60=50°. b) A=180−100−50=30°. c) F=180−90−40=50°.","topic":"Tam giác bằng nhau","img":null},{"id":"E15","source":"Tự luận 15","n":15,"kind":"essay","title":"Nhận biết tam giác bằng nhau","q":"Quan sát hai hình vẽ: chỉ ra hai tam giác bằng nhau và giải thích bằng các cạnh tương ứng.","solution":"Hình 1: ΔABC ≅ ΔCDA vì AB=CD, BC=DA và AC chung (c.c.c). Hình 2: ΔPAQ ≅ ΔPBQ vì PA=PB, AQ=BQ và PQ chung (c.c.c).","topic":"Tam giác bằng nhau","img":"tri"},{"id":"E16","source":"Tự luận 16","n":16,"kind":"essay","title":"Chứng minh bằng nhau c.c.c","q":"Vẽ ΔABC có AB=AC. M là trung điểm BC. Chứng minh ΔABM=ΔACM.","solution":"AB=AC (giả thiết); BM=CM (M trung điểm BC); AM chung. Suy ra ΔABM=ΔACM theo trường hợp cạnh–cạnh–cạnh.","topic":"Tam giác bằng nhau","img":null},{"id":"E17","source":"Tự luận 17","n":17,"kind":"essay","title":"Chứng minh vuông góc","q":"Theo Hình 3: hai góc được đánh dấu bằng 50°, m⊥AB. Chứng minh n⊥AB.","solution":"Hai góc so le trong bằng nhau (đều 50°) nên m//n. Mà AB⊥m (dấu vuông ở A), suy ra AB⊥n.","topic":"Góc và đường thẳng song song","img":"parallel17"},{"id":"E18","source":"Tự luận 18","n":18,"kind":"essay","title":"Góc tạo bởi đường gấp khúc","q":"Cho Ax//By. Trên hình 4, chứng minh ∠C = ∠A + ∠B.","solution":"Qua C kẻ đường thẳng song song với Ax và By. Hai góc tại C lần lượt bằng ∠A và ∠B (so le trong/đồng vị). Cộng hai góc này được ∠C = ∠A + ∠B.","topic":"Góc và đường thẳng song song","img":"angles18"}],"bonus":[{"id":"B1","source":"Nâng cao 1","kind":"mc","topic":"Phép toán","q":"−3/4 + 5/6 bằng bao nhiêu?","opts":["1/12","−1/12","2/10","−19/12"],"a":0,"why":"Quy đồng mẫu 12: −9/12 + 10/12=1/12.","bonus":true},{"id":"B2","source":"Nâng cao 2","kind":"mc","topic":"Phép toán","q":"(2/3)³·(2/3)² bằng bao nhiêu?","opts":["(2/3)⁶","(2/3)⁵","(4/9)⁵","2/3"],"a":1,"why":"Nhân hai lũy thừa cùng cơ số: cộng số mũ 3+2=5.","bonus":true},{"id":"B3","source":"Nâng cao 3","kind":"mc","topic":"Phép toán","q":"0,6 : (3/5) bằng số nào?","opts":["0,36","1","6","3/10"],"a":1,"why":"0,6=3/5; chia một số cho chính nó được 1.","bonus":true},{"id":"B4","source":"Nâng cao 4","kind":"mc","topic":"Số thực","q":"√144 bằng bao nhiêu?","opts":["12","−12","±12","72"],"a":0,"why":"Căn bậc hai số học là số không âm, và 12²=144.","bonus":true},{"id":"B5","source":"Nâng cao 5","kind":"mc","topic":"Số thực","q":"Trong các số sau, số nào là số vô tỉ?","opts":["0,75","−3/4","√2","0,(12)"],"a":2,"why":"√2 là số vô tỉ; các số còn lại đều hữu tỉ.","bonus":true},{"id":"B6","source":"Nâng cao 6","kind":"mc","topic":"Góc và đường thẳng song song","q":"Hai góc kề bù, một góc 134°. Góc còn lại là bao nhiêu?","opts":["46°","56°","134°","226°"],"a":0,"why":"Hai góc kề bù có tổng 180°; 180−134=46.","bonus":true},{"id":"B7","source":"Nâng cao 7","kind":"mc","topic":"Góc và đường thẳng song song","q":"Một tia phân giác chia góc 76° thành hai góc bằng bao nhiêu?","opts":["76°","152°","38°","36°"],"a":2,"why":"Mỗi góc bằng 76°/2=38°.","bonus":true},{"id":"B8","source":"Nâng cao 8","kind":"mc","topic":"Tam giác bằng nhau","q":"Tam giác có hai góc 45° và 65°, góc thứ ba là bao nhiêu?","opts":["80°","70°","90°","60°"],"a":1,"why":"Tổng ba góc tam giác là 180°; 180−45−65=70.","bonus":true},{"id":"B9","source":"Nâng cao 9","kind":"mc","topic":"Ứng dụng","q":"Một sản phẩm 200.000đ giảm 25%. Phải trả bao nhiêu?","opts":["50.000đ","175.000đ","150.000đ","125.000đ"],"a":2,"why":"Tiền giảm 50.000đ; còn 150.000đ.","bonus":true},{"id":"B10","source":"Nâng cao 10","kind":"mc","topic":"Phép toán","q":"Giá trị của (−2)⁴ là bao nhiêu?","opts":["−16","8","−8","16"],"a":3,"why":"Lũy thừa bậc chẵn của số âm là số dương: 16.","bonus":true},{"id":"B11","source":"Nâng cao 11","kind":"mc","topic":"Góc và đường thẳng song song","q":"Hai đường song song bị cắt bởi một đường thẳng, một góc so le trong là 70°. Góc kia bằng bao nhiêu?","opts":["110°","70°","140°","20°"],"a":1,"why":"Hai góc so le trong bằng nhau khi hai đường thẳng song song.","bonus":true},{"id":"B12","source":"Nâng cao 12","kind":"mc","topic":"Phép toán","q":"(1/3 − 1/6)·12 bằng bao nhiêu?","opts":["2","1","6","4"],"a":0,"why":"1/3−1/6=1/6, rồi nhân 12 được 2.","bonus":true}],"topics":[{"name":"Số hữu tỉ","icon":"🔢","facts":["Số hữu tỉ có dạng a/b với a,b là số nguyên, b ≠ 0; kí hiệu ℚ.","Hai số đối nhau có tổng bằng 0.","So sánh số âm, số 0, số dương và quy đồng khi cần."]},{"name":"Số thực","icon":"√","facts":["Số thập phân hữu hạn và vô hạn tuần hoàn đều là số hữu tỉ.","Số vô tỉ có biểu diễn thập phân vô hạn không tuần hoàn.","√a là căn bậc hai số học, với a ≥ 0."]},{"name":"Phép toán","icon":"➗","facts":["Cộng, trừ, nhân, chia số hữu tỉ theo quy tắc phân số.","Lũy thừa cùng cơ số: aᵐ·aⁿ=aᵐ⁺ⁿ; aᵐ:aⁿ=aᵐ⁻ⁿ (a≠0).","Thứ tự thực hiện phép tính: ngoặc → lũy thừa → nhân/chia → cộng/trừ."]},{"name":"Góc và đường thẳng song song","icon":"📐","facts":["Góc kề bù có tổng 180°; hai góc đối đỉnh bằng nhau.","Hai đường thẳng song song có các góc đồng vị, so le trong bằng nhau.","Nếu hai đường cùng vuông góc đường thứ ba thì chúng song song."]},{"name":"Tam giác bằng nhau","icon":"△","facts":["Tổng ba góc của một tam giác bằng 180°.","Hai tam giác bằng nhau có các cạnh và góc tương ứng bằng nhau.","Trường hợp c.c.c: ba cặp cạnh tương ứng bằng nhau."]},{"name":"Ứng dụng","icon":"💡","facts":["Giảm giá p% thì số tiền phải trả là giá gốc × (1−p/100).","Quãng đường đi đều: s=v×t.","Làm phép toán theo đơn vị thống nhất trước khi kết luận."]}],"images":{"line":"data:image/webp;base64,UklGRgoPAABXRUJQVlA4IP4OAADQTQCdASpTAcIAPl0ulEcjoqIhI1PpsHALiWdu/HyZUcADNcB2cn42dx/hOck6a10rSbyrK/5ff1vrR/1H/L6QDyy/8z1hf0j/meoX9af3M9970Lf4/1AP0g6zP0AP2v9M39w/ht/tn/C/cz2vdWB8n/47tX/z35O+fv4l8p/W/zL5H+130F/j322/Qfmd6jf6XwR/GP0n/X/2T8dfkI/G/5T/nN531v/Cf8D1AvYn6h/qvzh/y3OX/Mf4T2AO+n8EWgB+hvQP/6PQJ+Wf6T/uf6L4E/5j/cv+0MA7UbgvmrYBcoUcGgcMhFoS1CToww+p8FRfBfbTDspsF3ovQKYw7KiojcfBUXwQEtJCywq7ECES0Brqn6vLaCnOGtO/Ze91vEyJXsZ1X61zad9dv7giz/ARGRjM91KMNvXT6d183ldNuN4KQkrW8/0elzJf+IuCyO3v7ZM8iTtsIkzHCd/6v/+DrXZX3hPCMauhkej+0F9+c+z6/WhXs/gJ1WTxgo+Z3PKcMpyoRqRRqHUb8ijbsZw0cilG/RwVF8F/nup2eFzbmG/P3L7BfbTDsqKi+CI3FXwJRVE8utiJnJIYcRkICiouuHsIk0UI2xgAGf7+6LyT7Tq28CKr+N6tCn4puvELOlCeN7+v+T0b9lb2CaX/AiIKvmJuuW2LHvEW/lEohWqvihF9hU4uXkuB0rmvcrc function start(mode,topic){let arr=[],label='';const scored=[...DB.mc,...DB.tf,...DB.fill];if(mode==='all'){arr=DB.mc;label='Trắc nghiệm đề cương'}else if(mode==='tf'){arr=DB.tf;label='Đúng – Sai'}else if(mode==='fill'){arr=DB.fill;label='Điền kết quả'}else if(mode==='essays'){arr=DB.essays;label='18 câu tự luận'}else if(mode==='essayTopic'){arr=DB.essays.filter(x=>x.topic===topic);label='Tự luận · '+topic}else if(mode==='bonus'){arr=topic?DB.bonus.filter(x=>x.topic===topic):DB.bonus;label='Nâng cao'+(topic?' · '+topic:'');if(!arr.length){arr=DB.bonus;label='12 câu nâng cao'}}else if(mode==='topic'){arr=scored.filter(x=>x.topic===topic);label='Ôn tập · '+topic}else if(mode==='mix'){arr=shuffle(scored.filter(x=>!x.ungraded)).slice(0,15);label='Thử thách 15 câu'}else if(mode==='wrong'){const wrong=new Set(progress.wrong||[]);arr=[...scored,...DB.bonus].filter(x=>wrong.has(x.id));label='Luyện câu trả lời sai';if(!arr.length){alert('Chưa có câu sai để luyện lại. Hãy hoàn thành một lượt chơi trước.');return}}

function pic(q){const src=DB.images[q.img];return src?`<img class="diagram" src="${src}" alt="Hình minh họa gốc của đề cương, ${esc(q.source)}">`:''}
function renderQuiz(){const s=session,q=s.items[s.index];s.locked=false;const count=s.index+1;
 let input='';if(q.kind==='mc'){input=`<div class="options">${q.opts.map((x,i)=>`<button class="option" data-pick="${i}" type="button"><span class="letter">${'ABCD'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div>`}else if(q.kind==='tf'){input=`<div class="options"><button class="option" data-pick="true" type="button"><span class="letter">Đ</span>Đúng</button><button class="option" data-pick="false" type="button"><span class="letter">S</span>Sai</button></div>`}else if(q.kind==='fill'){input=`<input class="textbox" id="short" aria-label="Nhập đáp án" placeholder="Ví dụ: 5 hoặc 50°" autocomplete="off"><div class="actions" style="margin-top:10px"><button id="check" class="action">Kiểm tra đáp án ✓</button></div>`}else{input=`<p class="essay-note">✍️ Viết lời giải vào ô bên dưới. Phần tự luận không tự chấm điểm, hãy đối chiếu với đáp án sau khi làm xong.</p><textarea class="textbox textarea" id="essay" placeholder="Em trình bày cách làm ở đây..."></textarea><div class="actions" style="margin-top:10px"><button class="action" id="reveal">Xem hướng dẫn giải 📘</button></div>`}
 view.innerHTML=`<div class="qtop"><span class="pill">${q.kind==='mc'?'🧩 TRẮC NGHIỆM':q.kind==='tf'?'⚖️ ĐÚNG – SAI':q.kind==='fill'?'✍️ ĐIỀN ĐÁP ÁN':'📖 TỰ LUẬN'}</span><span class="qindex">CÂU ${count}/${s.items.length}</span></div><div class="bar"><div style="width:${(count-1)/s.items.length*100}%"></div></div><div class="qtag">${esc(q.source)} · ${esc(q.topic)}</div>${q.title?`<h2 class="title">${esc(q.title)}</h2>`:''}<div class="question">${esc(q.q)}</div>${pic(q)}${input}<div id="feedback"></div>`;
 if(q.kind==='mc'||q.kind==='tf'){view.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>choose(b.dataset.pick))}else if(q.kind==='fill'){$('#check').onclick=checkFill;$('#short').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();checkFill()}}}else{$('#reveal').onclick=revealEssay}
 foot.textContent=q.kind==='essay'?'Tự trình bày rồi xem hướng dẫn giải':q.kind==='fill'?'Nhập kết quả và nhấn Kiểm tra':'Chọn đáp án để biết Đúng/Sai ngay';markBtn('Câu tiếp theo →',false,advance);view.scrollTop=0;}
function feedback(cls,title,why){$('#feedback').innerHTML=`<div class="feedback ${cls}" role="status"><strong>${esc(title)}</strong>${esc(why)}</div>`;}
function choose(raw){let s=session,q=s.items[s.index];if(s.locked)return;s.locked=true;let pick=q.kind==='tf'?raw==='true':Number(raw);let isCorrect=pick===q.a;let ungraded=!!q.ungraded;
 if(!ungraded){s.graded++;if(isCorrect)s.correct++;s.answers.push({id:q.id,ok:isCorrect})}else s.notes++;
 view.querySelectorAll('[data-pick]').forEach(b=>{b.disabled=true;let val=q.kind==='tf'?b.dataset.pick==='true':Number(b.dataset.pick);if(ungraded){if(val===pick)b.classList.add('neutral');else b.classList.add('faded')}else if(val===q.a)b.classList.add('good');else if(val===pick)b.classList.add('bad');else b.classList.add('faded')});
 feedback(ungraded?'neutral':isCorrect?'good':'bad',ungraded?'⚠️ Câu cần làm rõ — miễn tính điểm':isCorrect?'✅ Chính xác!':'❌ Chưa đúng — đã hiện đáp án đúng',q.why);markBtn(s.index===s.items.length-1?'Xem tổng kết →':'Câu tiếp theo →',true,advance);foot.textContent=ungraded?'Đọc chú thích trước khi sang câu':'Đã khóa đáp án · có thể chuyển câu';}
function checkFill(){const s=session,q=s.items[s.index];if(s.locked)return;const val=($('#short').value||'').trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'.');if(!val){$('#short').focus();return}const correct=q.answers.some(x=>x.toLowerCase().replace(/\s+/g,'').replace(/,/g,'.')===val);s.locked=true;s.graded++;if(correct)s.correct++;s.answers.push({id:q.id,ok:correct});$('#check').disabled=true;$('#short').disabled=true;feedback(correct?'good':'bad',correct?'✅ Đúng rồi!':'❌ Chưa chính xác',`Đáp án: ${q.pretty}. ${q.why}`);foot.textContent='Đã kiểm tra đáp án';markBtn(s.index===s.items.length-1?'Xem tổng kết →':'Câu tiếp theo →',true,advance);}
function revealEssay(){const s=session,q=s.items[s.index];if(s.locked)return;s.locked=true;s.revealed++;$('#reveal').disabled=true;$('#feedback').innerHTML=`<div class="answerbox"><b>📘 Đáp án – hướng dẫn giải</b>\n${esc(q.solution)}</div>`;foot.textContent='Đọc lời giải, tự đối chiếu rồi sang câu';markBtn(s.index===s.items.length-1?'Xem tổng kết →':'Câu tiếp theo →',true,advance);}
function advance(){if(!session||!session.locked)return;if(session.index===session.items.length-1){finish();return}session.index++;render()}
function finish(){const s=session;const grade=s.graded>0;let pct=grade?Math.round(s.correct/s.graded*100):null;progress.rounds++;if(grade)progress.best=Math.max(progress.best,pct);const wrong=new Set(progress.wrong||[]);s.answers.forEach(a=>{if(a.ok)wrong.delete(a.id);else wrong.add(a.id)});progress.wrong=[...wrong];save();trkFinish({score:s.correct,maxScore:s.graded,correct:s.correct,total:s.graded,percent:grade?pct:undefined,graded:grade,mode:s.label,note:s.notes?`Miễn chấm ${s.notes} câu nguồn chưa rõ`:s.mode==='essays'?'Tự luận tự đối chiếu':''});show('result')}
function renderResult(){const s=session;const graded=s.graded>0;const pct=graded?Math.round(s.correct/s.graded*100):0;
 view.innerHTML=`<section class="result"><div style="font-size:42px">${graded?(pct>=80?'🏆':'🌟'):'📘'}</div><span class="pill">Đã hoàn thành</span><h1 class="title">${esc(s.label)}</h1><div class="big">${graded?pct+'%':'✓'}</div><p>${graded?`Đúng <b>${s.correct}/${s.graded}</b> câu tính điểm.`:`Đã xem hướng dẫn <b>${s.revealed}/${s.items.length}</b> câu tự luận.`}</p>${s.notes?`<div class="notice">⚠️ Có ${s.notes} câu chưa đủ dữ kiện đã được miễn tính điểm.</div>`:''}<div class="actions"><button class="action" id="again">🔁 Luyện lại</button><button class="action soft" id="backHome">⌂ Chọn môn</button></div></section><div class="sheet"><b>💡 Cách học hiệu quả</b><p class="muted">Xem lại cách giải trước khi làm vòng tiếp theo. Kết quả tạm lưu trên thiết bị đang dùng.</p></div>`;
 $('#again').onclick=()=>start(s.mode,s.topic);$('#backHome').onclick=home;foot.textContent='Đã lưu tiến độ trên thiết bị';markBtn('Trang chủ game ⌂',true,home);}
function render(){if(page==='home')renderHome();else if(page==='topic')renderTopic();else if(page==='quiz')renderQuiz();else if(page==='result')renderResult();}
render();
</script></body></html>
